{% load static %} 

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHo PlanDocente</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
   
    <style>
        
        .bg-uho { background-color: #222e58 !important; } 
        
        
        .btn-uho { 
            background-color: #93ba21; 
            color: white; 
            font-weight: bold;
        }
        .btn-uho:hover { 
            background-color: #7ea31a; 
            color: white; 
        }
        
        .navbar-brand img { 
            height: 45px; 
            margin-right: 15px; 
        }
    </style>
</head>
<body class="bg-light">

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-uho mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <!-- El logo oficial -->
                <img src="{% static 'img/logo-uho.png' %}" alt="Logo UHo">
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link text-white" href="/planes/">Planes Anuales</a>
                <a class="nav-link text-white" href="/admin/">Admin</a>
            </div>
        </div>
    </nav>

    
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 mb-3 text-muted">
        <small>&copy; 2026 - Tesis UHo PlanDocente</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
