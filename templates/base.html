{% load static %} 

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UHo PlanDocente</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos con los colores oficiales de la UHo -->
    <style>
        .bg-uho { background-color: #222e58 !important; } 
        .btn-uho { background-color: #93ba21; color: white; font-weight: bold; }
        .btn-uho:hover { background-color: #7ea31a; color: white; }
        .navbar-brand img { height: 45px; margin-right: 15px; }
    </style>
</head>
<body class="bg-light">

    <!-- NAVBAR CON EL AZUL INSTITUCIONAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-uho mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <img src="{% static 'img/logo-uho.png' %}" alt="Logo UHo">
            </a>
            
            <!-- Botón para móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link text-white" href="/planes/">Planes Anuales</a>
                    <a class="nav-link text-white" href="/planes/bandeja/">Bandeja del Jefe</a>
                    <a class="nav-link text-white" href="/admin/">Admin</a>
                    
                    <!-- Lógica de Sesión -->
                    {% if user.is_authenticated %}
                        <span class="nav-link text-white-50">| Hola, {{ user.username }}</span>
                        
                        <!-- FORMULARIO POST PARA CERRAR SESIÓN -->
                        <form method="POST" action="{% url 'logout' %}" class="d-inline m-0">
                            {% csrf_token %}
                            <button type="submit" class="nav-link text-white bg-transparent border-0" style="cursor: pointer;">
                                Salir
                            </button>
                        </form>
                    {% else %}
                        <a class="nav-link text-white fw-bold" href="{% url 'login' %}">Iniciar Sesión</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- EL HUECO MÁGICO PARA LAS PÁGINAS -->
    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer class="text-center mt-5 mb-3 text-muted">
        <small>&copy; 2026 - Tesis UHo PlanDocente</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
