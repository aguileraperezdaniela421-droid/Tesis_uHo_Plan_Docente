{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header text-white" style="background-color: #222e58;">
                    <h4 class="mb-0">👤 Mi Perfil Docente</h4>
                </div>
                <div class="card-body p-4">
                    <p><strong>Usuario:</strong> {{ perfil.user.username }}</p>
                    <p><strong>Departamento:</strong> {{ perfil.department.name }}</p>
                    
                    <hr>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-uho w-100 mt-3">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
