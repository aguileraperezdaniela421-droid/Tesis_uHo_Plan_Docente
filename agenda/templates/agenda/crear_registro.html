{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header text-white" style="background-color: #222e58;">
                    <h4 class="mb-0">➕ Registrar Tarea Diaria</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        {{ form.as_p }}
                        
                        <div class="mt-4 d-flex justify-content-between">
                            <a href="{% url 'mi_agenda' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-uho">Guardar Registro</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
