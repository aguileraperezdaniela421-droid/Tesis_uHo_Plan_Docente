{% extends 'base.html' %}

{% block content %}
    <div class="row justify-content-center mt-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header text-white" style="background-color: #222e58;">
                    <h4 class="mb-0">➕ Agregar Actividad al Plan</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted">Agregando actividad al plan de <strong>{{ plan.teacher.user.username }}</strong> ({{ plan.period.name }})</p>
                    
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        
                        <div class="mt-4 d-flex justify-content-between">
                            <a href="{% url 'detalle_plan' plan.id %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-uho">Guardar Actividad</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
