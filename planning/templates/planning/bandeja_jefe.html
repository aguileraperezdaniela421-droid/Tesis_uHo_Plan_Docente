{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold" style="color: #222e58;">📥 Bandeja de Planes Pendientes</h2>
    </div>
    
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead style="background-color: #222e58; color: white;">
                    <tr>
                        <th class="py-3 px-4">Docente</th>
                        <th class="py-3 px-4">Período</th>
                        <th class="py-3 px-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for plan in planes %}
                    <tr>
                        <td class="px-4 fw-semibold">{{ plan.teacher.user.username }}</td>
                        <td class="px-4">{{ plan.period.name }}</td>
                        <td class="px-4">
                            <a href="{% url 'detalle_plan' plan.id %}" class="btn btn-sm btn-outline-dark">Revisar</a>
                            <a href="{% url 'aprobar_plan' plan.id %}" class="btn btn-sm btn-success">✅ Aprobar</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center text-muted py-5">
                            No hay planes pendientes de revisión. ¡Buen trabajo!
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
{% endblock %}
